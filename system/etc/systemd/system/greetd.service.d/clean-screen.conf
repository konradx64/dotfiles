# Keep boot messages off the login screen (boot output itself is unchanged).
[Service]
# Start only once boot has finished (max 5s wait), so systemd's
# "[ OK ] Started ..." lines aren't printed on top of the login screen
Type=idle
# Wipe tty1 (boot messages + scrollback) before the login screen starts
TTYPath=/dev/tty1
TTYReset=yes
TTYVHangup=yes
TTYVTDisallocate=yes
