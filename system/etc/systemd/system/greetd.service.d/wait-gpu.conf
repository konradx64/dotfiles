# The AMD GPU driver now loads after the disk is mounted (in parallel with the
# rest of boot) instead of from the initramfs. Wait for it (max 10s) so the
# login screen starts on the real GPU console, not the temporary boot one.
[Service]
ExecStartPre=-/usr/bin/timeout 10 /bin/sh -c 'until grep -qx live /sys/module/amdgpu/initstate 2>/dev/null; do sleep 0.1; done'
