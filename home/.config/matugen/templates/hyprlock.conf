# GENERATED by matugen from your wallpaper — edit
# ~/.config/matugen/templates/hyprlock.conf, not ~/.config/hypr/hyprlock.conf
# See https://wiki.hypr.land/hypr-ecosystem/user/hyprlock/

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Blurred, darkened wallpaper on both monitors
background {
    monitor =
    path = {{image}}
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
}

# --- Everything below only on the main (left) monitor ---

# Clock
label {
    monitor = HDMI-A-1
    text = $TIME
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 170
    halign = center
    valign = center
}

# Date
label {
    monitor = HDMI-A-1
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb({{colors.on_surface_variant.default.hex_stripped}})
    font_size = 20
    font_family = Noto Sans
    position = 0, 75
    halign = center
    valign = center
}

# Password box
input-field {
    monitor = HDMI-A-1
    size = 320, 52
    rounding = 10
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    outer_color = rgb({{colors.primary.default.hex_stripped}})
    inner_color = rgb({{colors.surface_container.default.hex_stripped}})
    font_color = rgb({{colors.on_surface.default.hex_stripped}})
    check_color = rgb({{colors.tertiary.default.hex_stripped}})
    fail_color = rgb({{colors.error.default.hex_stripped}})
    font_family = Noto Sans
    placeholder_text = Password
    fail_text = $FAIL ($ATTEMPTS)
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
