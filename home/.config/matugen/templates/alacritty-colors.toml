# GENERATED by matugen from your wallpaper — edit
# ~/.config/matugen/templates/alacritty-colors.toml, not ~/.config/alacritty/colors.toml
# red/green/yellow/... are fixed colors shifted toward the wallpaper's hue
# (see [config.custom_colors] in ~/.config/matugen/config.toml).

[colors.primary]
background = "{{colors.surface.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"

[colors.cursor]
text   = "{{colors.on_primary.default.hex}}"
cursor = "{{colors.primary.default.hex}}"

[colors.selection]
text       = "{{colors.on_primary_container.default.hex}}"
background = "{{colors.primary_container.default.hex}}"

[colors.normal]
black   = "{{colors.surface_container_highest.default.hex}}"
red     = "{{colors.red.default.hex}}"
green   = "{{colors.green.default.hex}}"
yellow  = "{{colors.yellow.default.hex}}"
blue    = "{{colors.blue.default.hex}}"
magenta = "{{colors.magenta.default.hex}}"
cyan    = "{{colors.cyan.default.hex}}"
white   = "{{colors.on_surface_variant.default.hex}}"

[colors.bright]
black   = "{{colors.outline.default.hex}}"
red     = "{{colors.on_red_container.default.hex}}"
green   = "{{colors.on_green_container.default.hex}}"
yellow  = "{{colors.on_yellow_container.default.hex}}"
blue    = "{{colors.on_blue_container.default.hex}}"
magenta = "{{colors.on_magenta_container.default.hex}}"
cyan    = "{{colors.on_cyan_container.default.hex}}"
white   = "{{colors.on_surface.default.hex}}"
