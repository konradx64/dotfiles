# hypridle — what happens when you're away. See https://wiki.hypr.land/hypr-ecosystem/user/hypridle/
# Videos, games and calls that ask the system to stay awake pause these timers.
#
# Note: no "dim" stage — your monitors are on HDMI and have no software
# backlight control, so dimming isn't possible without extra DDC/CI setup.

general {
    lock_cmd = pidof hyprlock || hyprlock                # what "lock the session" runs
    before_sleep_cmd = loginctl lock-session             # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # screens back on after resume
}

# 10 min idle: lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 min idle: turn monitors off (they wake when you move the mouse / press a key)
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
