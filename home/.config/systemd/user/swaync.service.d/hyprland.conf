# Additions to the stock swaync.service (/usr/lib/systemd/user/swaync.service).
# Hyprland starts it from ~/.config/hypr/hyprland.lua; it is NOT enabled, so KDE never runs it.
# The stock unit already has Restart=on-failure: a crashed swaync comes back by itself.

[Service]
# Apps launched from the notification center stay open when swaync restarts.
KillMode=process
RestartSec=1
