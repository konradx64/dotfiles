# Additions to the stock waybar.service (/usr/lib/systemd/user/waybar.service).
# Hyprland starts it from ~/.config/hypr/hyprland.lua; it is NOT enabled, so KDE never runs it.
# The stock unit already has Restart=on-failure: a crashed Waybar comes back by itself.

[Service]
# Apps you open from the bar (rofi -> Firefox, btop, pavucontrol, ...) end up in this
# service's process group. The default would kill them all whenever Waybar restarts
# or crashes; "process" only stops Waybar itself and leaves your apps alone.
KillMode=process
RestartSec=1
